- name: Mark automatically installed packages as such
  block:
    - name: Find manual packages that are required by others
      ansible.builtin.shell: |
        set -o pipefail
        comm -12 <(apt-mark showmanual | sort) \
                 <(apt-cache depends --no-conflicts --no-suggests $(dpkg-query -f '${Package}\n' -W) | awk '/Depends:/ {print $2}' | sort -u)
      args:
        executable: /bin/bash
      register: base_config_packages_to_auto
      changed_when: false
      failed_when: base_config_packages_to_auto.stderr != ""

    - name: Switch all found packages to auto
      ansible.builtin.command: "apt-mark auto {{ base_config_packages_to_auto.stdout_lines | join(' ') }}"
      when: base_config_packages_to_auto.stdout_lines | length > 0
      register: base_config_apt_mark_result
      # Idempotence: if at least one package was changed, this text is in stdout
      changed_when: "'marked as auto installed' in base_config_apt_mark_result.stdout"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_config_packages }}"
    state: present

- name: Disable etckeeper's auto-commit
  ansible.builtin.lineinfile:
    path: /etc/etckeeper/etckeeper.conf
    regexp: '^#?\s*{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    state: present
  loop:
    - { key: 'AVOID_DAILY_AUTOCOMMITS', value: '1' }
    - { key: 'AVOID_COMMIT_BEFORE_INSTALL', value: '1' }

- name: Set timezone
  community.general.timezone:
    name: "{{ base_config_system_timezone }}"

- name: Set locale
  block:
    - name: Locales to be generated
      ansible.builtin.debconf:
        name: locales
        question: locales/locales_to_be_generated
        value: "{{ base_config_locales | join(', ') }}"
        vtype: multiselect
      register: base_config_locales_generated

    - name: Set default locale
      ansible.builtin.debconf:
        name: locales
        question: locales/default_environment_locale
        value: en_US.UTF-8
        vtype: select
      register: base_config_lang_selected

    - name: Update locale system config
      ansible.builtin.command: dpkg-reconfigure --frontend=noninteractive locales
      when: base_config_locales_generated.changed or base_config_lang_selected.changed
      changed_when: true

- name: Bash configuration
  block:
    - name: Remove /etc/skel/.bashrc and use /etc/bash.bashrc instead
      ansible.builtin.file:
        path: /etc/skel/.bashrc
        state: absent

    - name: Update /etc/bash.bashrc
      ansible.builtin.blockinfile:
        path: /etc/bash.bashrc
        insertafter: EOF
        marker: "# {mark} ANSIBLE MANAGED BASH CONFIG"
        block: "{{ lookup('ansible.builtin.file', 'bash_config') }}"

    - name: Install lesspipe-combined.sh
      ansible.builtin.copy:
        src: lesspipe-combined.sh
        dest: /usr/local/bin
        mode: "755"

    - name: Bash check window size
      ansible.builtin.lineinfile:
        path: /etc/bash.bashrc
        line: 'shopt -s checkwinsize'
        state: present
        create: false

    - name: Enable Bash completion
      ansible.builtin.replace:
        path: /etc/bash.bashrc
        regexp: |
          (?m)
          ^# (enable bash completion in interactive shells)
          #(if.*)
          #(.*)
          #(.*bash_completion)
          #(.*)
          #(.*)
          #(.*)
          #(fi)
        replace: |
          # \1
          \2
          \3
          \4
          \5
          \6
          \7
          \8

    - name: Bash aliases
      ansible.builtin.blockinfile:
        path: /etc/bash.bashrc
        insertafter: EOF
        marker: "# {mark} ANSIBLE MANAGED BASH ALIASES"
        block: "{{ lookup('ansible.builtin.file', 'bash_aliases') }}"


- name: Neovim configuration
  block:
    - name: Create the Neovim config dir
      ansible.builtin.file:
        path: "/etc/xdg/nvim"
        state: directory
        mode: '0755'

    - name: Create autoload directory for vim-plug
      ansible.builtin.file:
        path: "/usr/local/share/nvim/site/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "autoload"
        - "plugged"

    - name: Download and install vim-plug
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
        dest: /usr/local/share/nvim/site/autoload/plug.vim
        mode: '0644'

    - name: Install init.vim
      ansible.builtin.copy:
        src: init.vim
        dest: /etc/xdg/nvim/init.vim
        mode: '0644'

    - name: Install Neovim plugins via vim-plug
      ansible.builtin.command: nvim --headless +PlugInstall +qall
      register: base_config_plug_install_result
      changed_when: "'Installing' in base_config_plug_install_result.stderr or 'Installing' in base_config_plug_install_result.stdout"


- name: Htop configuration
  ansible.builtin.copy:
    src: htop_config
    dest: /etc/htoprc
    mode: "0644"

- name: Git configuration
  community.general.git_config:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    scope: system
  loop:
    - { key: 'core.autocrlf', value: 'input' }
    - { key: 'core.eol', value: 'lf' }
    - { key: 'init.defaultBranch', value: 'master' }
    - { key: 'diff.tool', value: 'vimdiff' }
    - { key: 'merge.tool', value: 'vimdiff' }
    - { key: 'merge.conflictStyle', value: 'zdiff3' }
    - { key: 'pull.rebase', value: 'true' }
    - { key: 'rebase.autoStash', value: 'true' }
    - { key: 'rebase.missingCommitsCheck', value: 'warn' }

    # aliases
    - { key: 'alias.s', value: 'status' }
    - { key: 'alias.sa', value: 'status --ignored' }
    - { key: 'alias.d', value: 'diff' }
    - { key: 'alias.ds', value: 'diff --staged' }
    - { key: 'alias.p', value: 'pull --recurse-submodules' }
    - { key: 'alias.l', value: "log --graph -m --pretty='tformat:%h %C(auto) %ad %an %d %s' --date=short" }
    - { key: 'alias.la', value: "log --graph -m --pretty='tformat:%h %C(auto) %ad %an %d %s' --date=short --all" }
    - { key: 'alias.ll', value: 'log --graph -m --stat --decorate --no-merges' }
    - { key: 'alias.lla', value: 'log --graph -m --stat --decorate --no-merges --all' }
    - key: 'alias.ls-large-files'
      value: |
        !f() { \
            # List the $1 biggest files in the repository
            echo "The pack column is the size of the object, compressed, inside the pack file."; \
            git verify-pack -v .git/objects/pack/pack-*.idx | grep -v chain | sort -k3nr | head -n $1 | { \
                echo 'size pack SHA location'; \
                while read -r line; do \
                    size=$(echo $line | cut -f 3 -d ' ' | numfmt --to=iec); \
                    compressedSize=$(echo $line | cut -f 4 -d ' ' | numfmt --to=iec); \
                    sha=$(echo $line | cut -f 1 -d ' '); \
                    other=$(git rev-list --all --objects | grep $sha); \
                    echo $size $compressedSize $other; \
                done } | column -t -s ' '; \
        }; f
    - key: 'alias.remove-from-all-history'
      value: |
        !f() { \
            # Delete an expression from all history
            # Usage: git remove-from-all-history "lib/Model/*.js"
            if command -v git-filter-repo >/dev/null 2>&1; then \
                git filter-repo --path "$1" --invert-paths; \
            else \
                # To rewrite only some revisions: use HEAD~10..HEAD instead of -- --all (doesn't work with filter-repo)
                echo "git-filter-repo not found. Falling back to filter-branch - don't forget delete-original afterwards!"; \
                filter="git rm -r --cached --ignore-unmatch $1"; \
                git filter-branch -f --tag-name-filter cat --prune-empty --index-filter "$filter" -- --all; \
                git for-each-ref --format="%(refname)" refs/original/ | xargs -n 1 git update-ref -d; \
                git expire-and-prune-now; \
            fi; \
        }; f
    - key: 'alias.extract-dir'
      value: |
        !f() { \
            # Reduce history to the given directory
            if command -v git-filter-repo >/dev/null 2>&1; then \
                git filter-repo --path "$1"; \
            else \
                echo "git-filter-repo not found. Falling back to filter-branch..."; \
                git filter-branch --tag-name-filter cat --prune-empty --subdirectory-filter "$1" -- --all; \
            fi; \
        }; f
    - key: 'alias.delete-original'
      value: |
        !f() { \
            # Delete backup made by filter-branch
            git for-each-ref --format="%(refname)" refs/original/ | xargs -n 1 git update-ref -d; \
        }; f
    - key: 'alias.expire-and-prune-now'
      value: |
        !f() { \
            # Actually prune the repository
            git reflog expire --expire=now --all && git gc --prune=now --aggressive; \
        }; f
    - key: 'alias.all-commits-by'
      value: |
        !f() { \
            # Rewrite ALL commits in history to the given name ($1) and email ($2)
            if command -v git-filter-repo >/dev/null 2>&1; then \
                git filter-repo --commit-callback "
                    commit.author_name = b'$1'
                    commit.author_email = b'$2'
                    commit.committer_name = b'$1'
                    commit.committer_email = b'$2'
                "; \
            else \
                echo "git-filter-repo not found. Falling back to filter-branch..."; \
                git filter-branch -f --tag-name-filter cat --env-filter '
                    export GIT_AUTHOR_NAME="$1"
                    export GIT_AUTHOR_EMAIL="$2"
                    export GIT_COMMITTER_NAME="$1"
                    export GIT_COMMITTER_EMAIL="$2";
                ' -- --all; \
            fi; \
        }; f

    # committer-date-is-author-date = git rebase --committer-date-is-author-date "$1"
    # author-date-is-committer-date = git rebase --ignore-date "$1"

