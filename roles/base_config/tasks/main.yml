---
- name: APT configuration
  ansible.builtin.copy:
    src: "{{ item.key }}"
    dest: "/etc/apt/apt.conf.d/99{{ item.value }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { key: 'apt_config', value: 'apt' }
    - { key: 'aptitude_config', value: 'aptitude' }


- name: Remove Docker APT language configuration
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/docker-no-languages
    state: absent
  when: ansible_facts['virtualization_type'] in ['docker', 'podman', 'containerd']

