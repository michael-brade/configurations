- name: "Git: ensure LFS"
  block:
    - name: "Git: check if LFS needs enabling"
      ansible.builtin.command: git lfs install --system --check
      register: base_config_git_lfs_status
      changed_when: false
      failed_when: false

    - name: "Git: activate LFS globally"
      ansible.builtin.command: git lfs install --system
      changed_when: true
      when: base_config_git_lfs_status.rc != 0
