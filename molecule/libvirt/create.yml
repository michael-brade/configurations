---
# molecule/libvirt/create.yml
# VMs come from the group "test_resources" in inventory/hosts.yml.

- name: Create libvirt test VMs
  hosts: localhost
  connection: local

  gather_facts: false

  no_log: "{{ molecule_no_log }}"

  vars:
    # export LIBVIRT_DEFAULT_URI="qemu:///..." in the devcontainer could overwrite this default
    libvirt_uri: "{{ lookup('ansible.builtin.env', 'LIBVIRT_DEFAULT_URI') | default('qemu:///system', true) }}"
    images_dir: /var/lib/libvirt/images/molecule

    # use cloud-init (genericcloud)
    base_image_url: https://cloud.debian.org/images/cloud/sid/daily/20261012-2629/debian-sid-genericcloud-amd64-daily-20261012-2629.qcow2
    base_image: "{{ images_dir }}/debian-sid-cloud-init.qcow2"

    ip_inventory_file: "{{ hostvars[groups['test_resources'][0]].inventory_dir }}/libvirt_hosts.yml"

    # Optional console password; empty = password login disabled (key only)
    vm_password: "{{ lookup('ansible.builtin.env', 'MOLECULE_VM_PASSWORD') | default('', true) }}"

    # Only the VMs whose disk was freshly created in this run (lazy, after `disks` is registered)
    new_vms: "{{ disks.results | selectattr('changed') | map(attribute='item') | list }}"

  tasks:
    - name: Collect VM definitions from the inventory
      ansible.builtin.set_fact:
        vms: >-
          {{ vms | default([]) + [{
            'name': item,
            'memory': hostvars[item].libvirt_memory | default(1024),
            'vcpus': hostvars[item].libvirt_vcpus | default(4),
            'disk_size': hostvars[item].libvirt_disk_size | default(''),
            'bridge': hostvars[item].libvirt_bridge | default('vlanbr'),
            'user': hostvars[item].ansible_user | default('debian'),
            'pubkey': hostvars[item].libvirt_ssh_pubkey | default('~/.ssh/id_ed25519.pub') | expanduser
          }] }}
      loop: "{{ groups['test_resources'] }}"

    - name: Download VM base image (once)
      ansible.builtin.get_url:
        url: "{{ base_image_url }}"
        dest: "{{ base_image }}"
        mode: "0644"

    - name: List existing domains
      community.libvirt.virt:
        command: list_vms
        uri: "{{ libvirt_uri }}"
      register: existing

    # force: false -> only copies when the target does not exist yet.
    # Resize only runs for freshly copied disks.
    - name: Create disk images from the base image
      ansible.builtin.copy:
        src: "{{ base_image }}"
        dest: "{{ images_dir }}/{{ item.name }}.qcow2"
        remote_src: true
        force: false
        mode: "0644"
      register: disks
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in existing.list_vms

    - name: Resize disk images (cloud-init grows the root fs on first boot to adapt to the new disk size)
      ansible.builtin.command:
        argv:
          - qemu-img
          - resize
          - "{{ images_dir }}/{{ item.name }}.qcow2"
          - "{{ item.disk_size }}"
      changed_when: true
      loop: "{{ new_vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.disk_size | length > 0

    - name: Set up cloud-init ISOs
      block:
        - name: Create cloud-init directories
          ansible.builtin.file:
            path: "{{ molecule_ephemeral_directory }}/cloud-init/{{ item.name }}"
            state: directory
            mode: "0755"
          loop: "{{ vms }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Write cloud-init user-data
          ansible.builtin.copy:
            dest: "{{ molecule_ephemeral_directory }}/cloud-init/{{ item.name }}/user-data"
            mode: "0644"
            content: |
              #cloud-config
              users:
                - name: {{ item.user }}
                  shell: /bin/bash
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  lock_passwd: {{ 'false' if vm_password else 'true' }}
                  ssh_authorized_keys:
                    - {{ lookup('ansible.builtin.file', item.pubkey) | trim }}
              ssh_pwauth: false
              {% if vm_password %}
              chpasswd:
                expire: false
                users:
                  - {name: "{{ item.user }}", password: "{{ vm_password }}", type: text}
              {% endif %}
          loop: "{{ vms }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Write cloud-init meta-data
          ansible.builtin.copy:
            dest: "{{ molecule_ephemeral_directory }}/cloud-init/{{ item.name }}/meta-data"
            mode: "0644"
            content: |
              instance-id: {{ item.name }}
              local-hostname: {{ item.name }}
          loop: "{{ vms }}"
          loop_control:
            label: "{{ item.name }}"

        # Volume label must be "cidata" for the NoCloud datasource
        - name: Build cloud-init seed ISOs
          ansible.builtin.command:
            argv:
              - xorriso
              - -as
              - mkisofs
              - -output
              - "{{ images_dir }}/{{ item.name }}-seed.iso"
              - -volid
              - cidata
              - -joliet
              - -rock
              - user-data
              - meta-data
            chdir: "{{ molecule_ephemeral_directory }}/cloud-init/{{ item.name }}"
            creates: "{{ images_dir }}/{{ item.name }}-seed.iso"
          loop: "{{ vms }}"
          loop_control:
            label: "{{ item.name }}"

    - name: Define VMs
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('ansible.builtin.template', 'domain.xml.j2') }}"
        uri: "{{ libvirt_uri }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in existing.list_vms

    - name: Start VMs
      community.libvirt.virt:
        name: "{{ item.name }}"
        state: running
        uri: "{{ libvirt_uri }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

    # No module for domifaddr, so virsh it is (read-only, hence changed_when: false)
    - name: Wait for an IPv4 address
      ansible.builtin.shell: |
        set -o pipefail
        ip=$(virsh -c {{ libvirt_uri }} domifaddr {{ item.name }} --source arp 2>/dev/null \
              | awk '/ipv4/ {split($4,a,"/"); print a[1]; exit}')
        if [ -n "$ip" ]; then
          echo "$ip"
          exit 0
        fi
        exit 1
      register: vm_ip
      until: vm_ip.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ item.stdout }}"
        port: 22
        timeout: 120
      loop: "{{ vm_ip.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Write every VM's IPv4 to inventory
      ansible.builtin.copy:
        dest: "{{ ip_inventory_file }}"
        mode: "0644"
        content: |
          all:
            hosts:
          {% for r in vm_ip.results %}
              {{ r.item.name }}:
                ansible_host: {{ r.stdout }}
          {% endfor %}
