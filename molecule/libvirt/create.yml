---
# molecule/libvirt/create.yml
# VMs come from the group "test_resources" in inventory/hosts.yml.

- name: Create libvirt test VMs
  hosts: localhost
  connection: local

  gather_facts: false

  no_log: "{{ molecule_no_log }}"

  vars:
    # export LIBVIRT_DEFAULT_URI="qemu:///..." in the devcontainer could overwrite this default
    libvirt_uri: "{{ lookup('ansible.builtin.env', 'LIBVIRT_DEFAULT_URI') | default('qemu:///system', true) }}"
    images_dir: /var/lib/libvirt/images

    base_image_url: https://cloud.debian.org/images/cloud/sid/daily/20260909-2596/debian-sid-nocloud-amd64-daily-20260909-2596.qcow2
    base_image: "{{ images_dir }}/debian-sid-nocloud.qcow2"
    vm_password: "{{ lookup('ansible.builtin.env', 'MOLECULE_VM_PASSWORD') | default('changeme', true) }}"
    scratch_dir: "{{ molecule_ephemeral_directory }}"
    ip_inventory_file: "{{ hostvars[groups['test_resources'][0]].inventory_dir }}/libvirt_hosts.yml"
    # Only the VMs we actually built in this run (evaluated lazily, after `disks` is registered)
    new_vms: "{{ disks.results | selectattr('changed') | map(attribute='item') | list }}"

  tasks:
    - name: Collect VM definitions from the inventory
      ansible.builtin.set_fact:
        vms: >-
          {{ vms | default([]) + [{
            'name': item,
            'memory': hostvars[item].libvirt_memory | default(1024),
            'vcpus': hostvars[item].libvirt_vcpus | default(4),
            'disk_size': hostvars[item].libvirt_disk_size | default('+10G'),
            'bridge': hostvars[item].libvirt_bridge | default('vlanbr'),
            'user': hostvars[item].ansible_user | default('debian'),
            'pubkey': hostvars[item].libvirt_ssh_pubkey | default(lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519.pub')
          }] }}
      loop: "{{ groups['test_resources'] }}"

    - name: Download VM base image (once)
      ansible.builtin.get_url:
        url: "{{ base_image_url }}"
        dest: "{{ base_image }}"
        mode: "0644"

    - name: Write sshd_config used for customization
      ansible.builtin.copy:
        dest: "{{ scratch_dir }}/sshd_config"
        mode: "0644"
        content: |
          Port 22
          ListenAddress 0.0.0.0
          PubkeyAuthentication yes
          PasswordAuthentication no
          UsePAM yes
          Subsystem sftp /usr/lib/openssh/sftp-server

    - name: Write sudoers drop-ins
      ansible.builtin.copy:
        dest: "{{ scratch_dir }}/sudoers_{{ item.name }}"
        mode: "0440"
        content: "{{ item.user }} ALL=(ALL) NOPASSWD:ALL\n"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: List existing domains
      community.libvirt.virt:
        command: list_vms
        uri: "{{ libvirt_uri }}"
      register: existing

    # force: false -> only copies when the target does not exist yet.
    # Everything that follows (resize, customize) runs only for freshly copied disks.
    - name: Create disk images from the base image
      ansible.builtin.copy:
        src: "{{ base_image }}"
        dest: "{{ images_dir }}/{{ item.name }}.qcow2"
        remote_src: true
        force: false
        mode: "0644"
      register: disks
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in existing.list_vms

    - name: Resize disk images
      ansible.builtin.command:
        argv:
          - qemu-img
          - resize
          - "{{ images_dir }}/{{ item.name }}.qcow2"
          - "{{ item.disk_size }}"
      changed_when: true
      loop: "{{ new_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Customize images (ssh, user, sudo, key)
      ansible.builtin.command:
        argv:
          - virt-customize
          - -a
          - "{{ images_dir }}/{{ item.name }}.qcow2"
          - --hostname
          - "{{ item.name }}"
          - --network
          - --run-command
          - apt-get update && apt-get install -y openssh-server sudo python3
          - --upload
          - "{{ scratch_dir }}/sshd_config:/etc/ssh/sshd_config"
          - --run-command
          - systemctl enable ssh
          - --run-command
          - "useradd -m -s /bin/bash {{ item.user }}"
          - --password
          - "{{ item.user }}:password:{{ vm_password }}"
          - --upload
          - "{{ scratch_dir }}/sudoers_{{ item.name }}:/etc/sudoers.d/{{ item.user }}"
          - --run-command
          - "chmod 0440 /etc/sudoers.d/{{ item.user }}"
          - --ssh-inject
          - "{{ item.user }}:file:{{ item.pubkey }}"
      environment:
        LIBGUESTFS_BACKEND: direct
      changed_when: true
      loop: "{{ new_vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Define VMs
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('ansible.builtin.template', 'domain.xml.j2') }}"
        uri: "{{ libvirt_uri }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in existing.list_vms

    - name: Start VMs
      community.libvirt.virt:
        name: "{{ item.name }}"
        state: running
        uri: "{{ libvirt_uri }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

    # No module for domifaddr, so virsh it is (read-only, hence changed_when: false)
    - name: Wait for an IPv4 address
      ansible.builtin.shell: |
        set -o pipefail
        for src in lease agent arp; do
          ip=$(virsh -c {{ libvirt_uri }} domifaddr {{ item.name }} --source "$src" 2>/dev/null \
               | awk '/ipv4/ {split($4,a,"/"); print a[1]; exit}')
          if [ -n "$ip" ]; then echo "$ip"; exit 0; fi
        done
        exit 1
      register: vm_ip
      until: vm_ip.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ item.stdout }}"
        port: 22
        timeout: 120
      loop: "{{ vm_ip.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Ensure generated inventory directory exists
      ansible.builtin.file:
        path: "{{ ip_inventory_file | dirname }}"
        state: directory
        mode: "0755"

    - name: Write ansible_host for every VM
      ansible.builtin.copy:
        dest: "{{ ip_inventory_file }}"
        mode: "0644"
        content: |
          all:
            hosts:
          {% for r in vm_ip.results %}
              {{ r.item.name }}:
                ansible_host: {{ r.stdout }}
          {% endfor %}
