---
all:
  children:
    test_resources:
      hosts:
        debian-sid-vm:
          libvirt_memory: 1024
          libvirt_vcpus: 4
          # libvirt_disk_size: +10G
          libvirt_bridge: vlanbr
      vars:
        ansible_user: debian
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        libvirt_ssh_pubkey: ~/.ssh/id_ed25519.pub


        # use cloud-init (genericcloud)
        base_image_url: "https://cloud.debian.org/images/cloud/sid/daily/20261012-2629/debian-sid-genericcloud-amd64-daily-20261012-2629.qcow2"
        base_image: "{{ images_dir }}/debian-sid-cloud-init.qcow2"

        # Optional console password; empty = password login disabled (key only)
        vm_password: "{{ lookup('ansible.builtin.env', 'MOLECULE_VM_PASSWORD') | default('', true) }}"

        # ansible_host is NOT set here: create.yml discovers the IP and
        # writes it into a generated inventory file next to this one.

  vars:
    # export LIBVIRT_URI="qemu:///..." in the devcontainer could overwrite this default
    libvirt_uri: "{{ lookup('ansible.builtin.env', 'LIBVIRT_URI') | default('qemu:///session', true) }}"

    images_dir: "{{ lookup('ansible.builtin.env', 'HOST_HOME') }}/.local/share/libvirt/images"

    ip_inventory_file: >-
      {{ ansible_inventory_sources
        | select('match', lookup('ansible.builtin.env', 'MOLECULE_SCENARIO_DIRECTORY'))
        | first }}/libvirt_hosts.yml
