---
all:
  children:
    test_resources:
      hosts:
        debian-sid-vm:
          libvirt_memory: 1024
          libvirt_vcpus: 4
          # libvirt_disk_size: +10G
          libvirt_bridge: vlanbr
      vars:
        ansible_user: debian
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        libvirt_ssh_pubkey: ~/.ssh/id_ed25519.pub

        image_url: "https://cloud.debian.org/images/cloud/sid/daily/20260909-2596/debian-sid-nocloud-amd64-daily-20260909-2596.qcow2"

        # ansible_host is NOT set here: create.yml discovers the IP and
        # writes it into a generated inventory file next to this one.
