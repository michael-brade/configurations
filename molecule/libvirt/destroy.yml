---
# molecule/libvirt/destroy.yml
- name: Destroy VMs on libvirt
  hosts: localhost
  connection: local
  gather_facts: false

  no_log: "{{ molecule_no_log }}"

  vars:
    libvirt_uri: "{{ lookup('ansible.builtin.env', 'LIBVIRT_DEFAULT_URI') | default('qemu:///system', true) }}"
    images_dir: /var/lib/libvirt/images/molecule
    scratch_dir: "{{ molecule_ephemeral_directory }}"
    ip_inventory_file: "{{ hostvars[groups['test_resources'][0]].inventory_dir }}/libvirt_hosts.yml"

  tasks:
    - name: List existing domains
      community.libvirt.virt:
        command: list_vms
        uri: "{{ libvirt_uri }}"
      register: existing

    - name: Stop VMs
      community.libvirt.virt:
        name: "{{ item }}"
        state: destroyed
        uri: "{{ libvirt_uri }}"
      loop: "{{ groups['test_resources'] }}"
      when: item in existing.list_vms

    - name: Undefine VMs
      community.libvirt.virt:
        name: "{{ item }}"
        command: undefine
        uri: "{{ libvirt_uri }}"
      loop: "{{ groups['test_resources'] }}"
      when: item in existing.list_vms

    - name: Remove disks, seed ISOs, and cloud-init files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ groups['test_resources']
           | map('regex_replace', '^(.*)$', images_dir ~ '/\1.qcow2') | list
         + groups['test_resources']
           | map('regex_replace', '^(.*)$', images_dir ~ '/\1-seed.iso') | list
         + [scratch_dir ~ '/cloud-init', ip_inventory_file] }}

    # The shared base image (debian-sid-cloud-init.qcow2) is kept on purpose,
    # so the next create does not download it again.
