---

ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        # - --force-handlers
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory/
        # - --extra-vars=environment=test

      ansible_navigator:
      #   - --mode stdout
      #   - --pull-policy missing
        - --inventory=${MOLECULE_SCENARIO_DIRECTORY}/inventory/
      #   - --execution-environment-image ghcr.io/ansible/community-ansible-dev-tools:latest
  env:
    ANSIBLE_FORCE_COLOR: "true"
  cfg:
    defaults:
      host_key_checking: false
      strategy_plugins: ${MOLECULE_PROJECT_DIRECTORY}/strategy_plugins

# shared_state: true

# Dependency management (download roles/collections)
dependency:
  name: galaxy
  options:
    # ignore-certs: false
    # ignore-errors: false
    # role-file: requirements.yml
    requirements-file: requirements.yml


scenario:
  converge_sequence:
    - create
    - converge
    - destroy

  test_sequence:
    # - destroy
    - create
    - converge
    # - verify
    - destroy
